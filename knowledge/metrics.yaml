# 数值字段字典：告诉程序「屏幕上的这个数字叫什么、在哪块区域、长什么样、合理范围是多少」
#
# 为什么必须带 region：这游戏的「体力」标签是个图标，OCR 只吐出 `84/150`；
# 而训练页上还有 `218/271`、`108/134`、`4/4`，文本形态完全一样。
# 实测主界面体力在右上角 x≈0.78 / y≈0.04，剩余次数在 x≈0.96，混淆项在 y≈0.66，靠位置就能分开。
#
# 字段说明：
#   region      归一化区域 [x1,y1,x2,y2]，数字的「中心点」落在这里才算命中；为空表示全屏
#   pattern     正则列表，按顺序尝试；用捕获组取值
#   value_group 取第几组作为数值（默认 1）
#   max_group   若是「当前/上限」形式，上限在第几组
#   unit_group  单位（万/亿）在第几组，自动换算
#   range       合理区间，超出判为读错
#   required    缺失时是否必须停下
#   post        额外处理：date_cn

fields:
  体力:
    label: 体力 / 精力
    region: [0.70, 0.00, 0.90, 0.09]
    pattern:
      - '(\d{1,4})\s*/\s*(\d{1,4})'
      - '体力\s*(\d{1,4})\s*/\s*(\d{1,4})'
    value_group: 1
    max_group: 2
    range: [0, 999]
    required: true

  剩余次数:
    label: 今日剩余次数
    region: [0.90, 0.00, 1.00, 0.09]
    pattern:
      - '(\d{1,2})\s*/\s*(\d{1,2})'
      - '剩余\s*(\d{1,2})\s*次'
    value_group: 1
    max_group: 2
    range: [0, 99]
    required: false

  金币:
    label: 金币
    region: [0.44, 0.00, 0.57, 0.09]
    pattern:
      - '([\d.]+)\s*([万亿]?)'
    unit_group: 2
    range: [0, 1000000000000]
    required: false

  钻石:
    label: 钻石
    region: [0.57, 0.00, 0.70, 0.09]
    pattern:
      - '([\d.]+)\s*([万亿]?)'
    unit_group: 2
    range: [0, 1000000000]
    required: false
